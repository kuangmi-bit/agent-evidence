# Every Evidence run filed as an issue in probityai/agent-evidence, and every open cell someone has said they take.
# Edit this file by hand when a run is filed, rerun or answered; tools/gen_status.py renders it on the status page.
#
# operation is one of:
#   author-operated   the filer wrote the software or fixture under test and ran it
#   outside-operated  someone who did not write the software or fixture ran it; independence is not established
# rerun, when present, is what Probity reran from the filed pins, on which date.

